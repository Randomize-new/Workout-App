<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#080808">
<link rel="manifest" id="manifest-link">
<title>Workout</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080808;--s1:#111;--s2:#1a1a1a;--s3:#232323;--s4:#2c2c2c;
  --bd:#2a2a2a;--bd2:#383838;
  --tx:#f2efea;--t2:#8a8780;--t3:#4a4845;
  --go:#3ddc84;--go-d:rgba(61,220,132,.12);--go-b:rgba(61,220,132,.3);
  --bl:#4eaff5;--bl-d:rgba(78,175,245,.11);--bl-b:rgba(78,175,245,.3);
  --am:#f5b84e;--am-d:rgba(245,184,78,.11);--am-b:rgba(245,184,78,.3);
  --rd:#f5604e;--rd-d:rgba(245,96,78,.1);--rd-b:rgba(245,96,78,.3);
  --pu:#b07ef5;--pu-d:rgba(176,126,245,.11);
  --fb:#6db33f;--fb-d:rgba(109,179,63,.1);
  --push:#c0532a;--pull:#1d9e75;--leg:#5a8a1a;--neu:#5a5855;
  --r:12px;--rs:8px;--rsm:5px;
  --nav:52px;--tab:60px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
html{background:var(--bg);height:100%;}
body{color:var(--tx);font-family:'DM Sans',sans-serif;font-size:15px;line-height:1.5;min-height:100%;background:var(--bg);overscroll-behavior:none;padding-bottom:calc(var(--tab) + var(--safe-b));}
button,input{font-family:'DM Sans',sans-serif;}
button{cursor:pointer;border:none;background:none;-webkit-appearance:none;}
input{-webkit-appearance:none;appearance:none;}

/* ── NAV ── */
.nav{position:sticky;top:0;z-index:200;height:var(--nav);background:rgba(8,8,8,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 14px;gap:10px;}
.nav-brand{font-size:17px;font-weight:600;letter-spacing:-.3px;flex:1;}
.mode-row{display:flex;gap:4px;}
.mbtn{padding:5px 11px;border-radius:20px;font-size:11px;font-weight:500;border:1px solid var(--bd2);color:var(--t3);background:transparent;transition:all .15s;}
.mbtn.on-gym{background:var(--bl-d);border-color:var(--bl-b);color:var(--bl);}
.mbtn.on-home{background:var(--pu-d);border-color:var(--pu);color:var(--pu);}
.sync-btn{width:30px;height:30px;border-radius:50%;border:1px solid var(--bd);background:var(--s2);display:flex;align-items:center;justify-content:center;}
.sdot{width:8px;height:8px;border-radius:50%;background:var(--t3);}
.sdot.synced{background:var(--go);}
.sdot.saving{background:var(--am);animation:pulse 1s infinite;}
.sdot.loading{background:var(--bl);animation:pulse 1s infinite;}
.sdot.error{background:var(--rd);}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ── FOOTBALL TOGGLE ── */
.ftgl{display:flex;align-items:center;gap:8px;padding:7px 14px 5px;border-bottom:1px solid var(--bd);}
.ftgl-lbl{font-size:10px;font-weight:500;color:var(--t3);letter-spacing:.5px;}
.ftgl-btn{padding:3px 11px;border-radius:20px;font-size:11px;font-weight:500;border:1px solid var(--bd2);color:var(--t3);background:var(--s2);}
.ftgl-btn.on{background:var(--fb-d);border-color:var(--fb);color:var(--fb);}

/* ── DAY STRIP ── */
.day-strip{padding:7px 10px 5px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--bd);}
.day-strip::-webkit-scrollbar{display:none;}
.day-inner{display:flex;gap:5px;width:max-content;}
.dc{border-radius:var(--rs);padding:6px 10px 5px;display:flex;flex-direction:column;align-items:center;gap:1px;border:1px solid var(--bd);background:var(--s1);min-width:44px;-webkit-appearance:none;}
.dc .dn{font-size:11px;font-weight:600;color:var(--t3);}
.dc .ds{font-size:8px;color:var(--t3);line-height:1.1;}
.dc.active{background:var(--go);border-color:var(--go);}
.dc.active .dn,.dc.active .ds{color:#080808;}
.dc.fb-day{border-color:rgba(109,179,63,.35);} .dc.fb-day .dn{color:var(--fb);}
.dc.rehab-day{border-color:var(--bl-b);} .dc.rehab-day .dn{color:var(--bl);}
.dc.plyo-day{border-color:var(--am-b);} .dc.plyo-day .dn{color:var(--am);}
.dc.rec-day{border-color:var(--pu-d);} .dc.rec-day .dn{color:var(--pu);}
.dc.daily-chip{border-color:var(--rd-b);background:var(--rd-d);} .dc.daily-chip .dn{color:var(--rd);}
.dc.daily-chip.active{background:var(--rd);} .dc.daily-chip.active .dn,.dc.daily-chip.active .ds{color:#fff;}
.dc.logged-day .ds::after{content:'·';color:var(--go);margin-left:1px;font-size:10px;}

/* ── ENERGY ROW ── */
.energy-row{display:flex;gap:5px;padding:8px 12px 4px;}
.ebtn{flex:1;padding:8px 4px;border-radius:var(--rs);border:1px solid var(--bd2);background:var(--s2);font-size:11px;font-weight:500;color:var(--t3);line-height:1.2;text-align:center;}
.ebtn small{display:block;font-size:9px;opacity:.7;margin-top:1px;}
.ebtn.e20{background:var(--rd-d);border-color:var(--rd-b);color:var(--rd);}
.ebtn.e50{background:var(--am-d);border-color:var(--am-b);color:var(--am);}
.ebtn.e100{background:var(--go-d);border-color:var(--go-b);color:var(--go);}
.energy-msg{margin:3px 12px 0;padding:7px 10px;border-left:2px solid;border-radius:0 var(--rsm) var(--rsm) 0;font-size:11px;color:var(--t2);line-height:1.5;}
.energy-msg.em20{background:var(--rd-d);border-color:var(--rd);}
.energy-msg.em50{background:var(--am-d);border-color:var(--am);}
.energy-msg.em100{display:none;}

/* ── SESSION HEADER ── */
.s-wrap{padding:10px 12px 20px;}
.s-hd{margin-bottom:10px;}
.s-eyebrow{font-size:9px;font-weight:600;letter-spacing:.8px;color:var(--t3);text-transform:uppercase;margin-bottom:3px;}
.s-name{font-size:22px;font-weight:600;letter-spacing:-.4px;line-height:1.1;}
.s-time{font-size:11px;color:var(--t3);margin-top:4px;}
.progress-row{display:flex;align-items:center;gap:8px;margin:6px 0 10px;}
.prog-track{flex:1;height:3px;background:var(--s4);border-radius:2px;}
.prog-fill{height:3px;border-radius:2px;background:var(--go);transition:width .4s;}
.prog-lbl{font-size:10px;color:var(--t3);font-family:'DM Mono',monospace;min-width:32px;text-align:right;}

/* ── ALERTS ── */
.note{padding:9px 11px;border-left:2px solid;border-radius:0 var(--rs) var(--rs) 0;font-size:11px;color:var(--t2);line-height:1.6;margin-bottom:8px;}
.note.inf{background:var(--bl-d);border-color:var(--bl);}
.note.warn{background:var(--am-d);border-color:var(--am);}
.note.suc{background:var(--go-d);border-color:var(--go);}
.note.dng{background:var(--rd-d);border-color:var(--rd);}
.note.pur{background:var(--pu-d);border-color:var(--pu);}
.note strong{display:block;font-weight:500;color:var(--tx);margin-bottom:2px;font-size:12px;}
.sec-lbl{font-size:9px;font-weight:600;letter-spacing:.7px;text-transform:uppercase;color:var(--t3);margin:12px 0 6px;}

/* ── PAIR CARDS ── */
.pair-card{border-radius:var(--r);border:1px solid var(--bd);background:var(--s1);overflow:hidden;margin-bottom:8px;transition:border-color .2s;}
.pair-card.pair-done{border-color:var(--go-b);}
.pair-card.pair-open{border-color:var(--bd2);}
.pair-card.cross{border-color:var(--pu-d);}
.pair-hd{display:flex;align-items:stretch;cursor:pointer;min-height:60px;}
.pair-hd-info{flex:1;padding:10px 12px;}
.pair-top{display:flex;align-items:center;gap:6px;margin-bottom:5px;}
.pair-tag-txt{font-size:10px;font-weight:500;color:var(--t3);}
.pair-tag-badge{font-size:9px;padding:1px 6px;border-radius:20px;background:var(--s3);color:var(--t3);border:.5px solid var(--bd2);}
.pair-exs{display:flex;flex-direction:column;gap:3px;}
.pair-ex-row{display:flex;align-items:center;gap:7px;}
.ex-color{width:3px;border-radius:2px;height:14px;flex-shrink:0;}
.ex-nm-preview{font-size:13px;font-weight:500;color:var(--tx);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ex-sp-preview{font-size:11px;color:var(--t3);white-space:nowrap;}
.pair-sep{font-size:10px;color:var(--t3);padding-left:10px;}
.pair-chv-col{width:44px;display:flex;align-items:center;justify-content:center;border-left:1px solid var(--bd);}
.pair-chv-col svg{width:16px;height:16px;transition:transform .2s;}
.pair-card.pair-open .pair-chv-col svg{transform:rotate(180deg);}
.pair-done-ico{width:20px;height:20px;border-radius:50%;background:var(--go-d);border:1px solid var(--go-b);display:flex;align-items:center;justify-content:center;}
.pair-done-ico svg{width:10px;height:10px;}

/* ── PAIR BODY ── */
.pair-body{border-top:1px solid var(--bd);padding:13px;display:none;}
.pair-card.pair-open .pair-body{display:block;}
.ex-sec{margin-bottom:12px;}
.ex-sec:last-child{margin-bottom:0;}
.ex-sec-hd{display:flex;align-items:center;gap:7px;margin-bottom:8px;}
.ex-sec-bar{width:3px;height:100%;border-radius:2px;align-self:stretch;flex-shrink:0;}
.ex-sec-info{flex:1;}
.ex-sec-nm{font-size:13px;font-weight:500;color:var(--tx);}
.ex-sec-sp{font-size:11px;color:var(--t3);}
.cue{background:var(--s2);border-radius:var(--rs);padding:9px 11px;font-size:12px;color:var(--t2);line-height:1.65;margin-bottom:8px;}
.corr{background:var(--bl-d);border-radius:var(--rs);padding:8px 11px;font-size:11px;color:var(--bl);line-height:1.6;margin-bottom:8px;border:.5px solid var(--bl-b);}
.corr b{font-weight:500;display:block;margin-bottom:2px;}
.tempo-row{display:flex;gap:1px;margin-bottom:8px;width:fit-content;}
.tp{padding:5px 12px;text-align:center;background:#15133a;border:1px solid #534AB7;border-radius:0;}
.tp:first-child{border-radius:var(--rsm) 0 0 var(--rsm);}
.tp:last-child{border-radius:0 var(--rsm) var(--rsm) 0;}
.tp+.tp{border-left:none;}
.tp-n{font-size:16px;font-weight:500;color:#CECBF6;line-height:1;font-family:'DM Mono',monospace;}
.tp-l{font-size:8px;color:#7F77DD;margin-top:1px;}
.tnote{font-size:11px;color:var(--t3);font-style:italic;margin-bottom:8px;line-height:1.5;}
.yt-a{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--bl);margin-bottom:8px;text-decoration:none;}
.yt-ic{width:16px;height:16px;border-radius:3px;background:#f00;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

/* ── SET LOGGER ── */
.sets-hd-lbl{font-size:10px;font-weight:500;color:var(--t3);letter-spacing:.5px;margin-bottom:6px;display:block;}
.set-rows{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;}
.set-row{display:grid;grid-template-columns:26px 1fr 1fr 48px;gap:5px;align-items:center;}
.set-lbl{font-size:11px;font-weight:600;color:var(--t3);font-family:'DM Mono',monospace;text-align:center;}
.set-in{min-width:0;width:100%;height:48px;background:var(--s3);border:1px solid var(--bd2);border-radius:var(--rs);color:var(--tx);font-size:16px;text-align:center;padding:0 2px;-webkit-appearance:none;appearance:none;}
.set-in:focus{outline:none;border-color:var(--go);background:var(--s2);}
.set-in::placeholder{color:var(--t3);font-size:11px;}
.set-col-labels{display:grid;grid-template-columns:26px 1fr 1fr 48px;gap:5px;margin-bottom:4px;}
.set-col-labels span{font-size:10px;color:var(--t3);text-align:center;}
.set-ck{width:48px;height:48px;border-radius:var(--rs);border:1px solid var(--bd2);background:var(--s3);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--t3);transition:all .15s;}
.set-ck.done-set{background:var(--go-d);border-color:var(--go-b);color:var(--go);}
.pair-divider{display:flex;align-items:center;gap:8px;margin:12px 0;}
.pdl{flex:1;height:.5px;background:var(--bd);}
.pdt{font-size:9px;color:var(--t3);letter-spacing:.5px;text-transform:uppercase;}

/* ── REST TIMER ── */
.rest-row{display:flex;align-items:center;gap:8px;padding:9px 11px;background:var(--s3);border-radius:var(--rs);margin-bottom:10px;border:1px solid var(--bd);}
.rest-lbl{font-size:11px;color:var(--t3);flex:1;}
.rest-ct{font-size:22px;font-weight:500;color:var(--tx);min-width:46px;text-align:right;font-family:'DM Mono',monospace;}
.rest-ct.ticking{color:var(--go);}
.rest-ct.done-rest{color:var(--go);}
.rest-btn{padding:5px 12px;border-radius:var(--rs);border:1px solid var(--bd2);background:var(--s4);font-size:11px;font-weight:500;color:var(--t2);}
.rest-btn.running{border-color:var(--rd-b);color:var(--rd);}

/* ── MARK DONE ── */
.mark-btn{width:100%;padding:11px;border-radius:var(--rs);border:1px solid var(--go-b);background:transparent;font-size:13px;font-weight:500;color:var(--go);}
.mark-btn.done-mark{background:var(--go-d);}

/* ── SPECIAL SESSIONS ── */
.info-card{padding:24px;background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);text-align:center;margin-bottom:8px;}
.info-card-t{font-size:16px;font-weight:600;color:var(--t2);margin-bottom:5px;}
.info-card-s{font-size:12px;color:var(--t3);line-height:1.7;}
.fb-card{border-radius:var(--r);border:1px solid rgba(109,179,63,.3);background:var(--s1);padding:14px;margin-bottom:8px;}
.fbr{display:flex;align-items:flex-start;gap:8px;padding:6px 0;border-bottom:.5px solid var(--bd);font-size:13px;}
.fbr:last-child{border-bottom:none;}
.fbl{color:var(--t2);min-width:90px;flex-shrink:0;font-size:12px;}
.fbv{color:var(--tx);font-weight:500;flex:1;}
.run-card{border-radius:var(--r);border:1px solid var(--bl-b);background:var(--s1);padding:14px;margin-bottom:8px;}

/* ── SIMPLE EXPAND CARDS (rehab/daily) ── */
.exp-card{border-radius:var(--r);border:1px solid var(--bd);background:var(--s1);overflow:hidden;margin-bottom:7px;}
.exp-card.open{border-color:var(--bd2);}
.exp-card.rehab{border-color:var(--rd-b);}
.exp-hd{display:flex;align-items:center;gap:9px;padding:11px 13px;min-height:54px;cursor:pointer;}
.exp-hd-info{flex:1;min-width:0;}
.exp-nm{font-size:13px;font-weight:500;color:var(--tx);margin-bottom:2px;}
.exp-sp{font-size:11px;color:var(--t3);}
.exp-tag{font-size:10px;padding:2px 7px;border-radius:20px;font-weight:500;}
.exp-tag.rt{background:var(--rd-d);color:var(--rd);border:.5px solid var(--rd-b);}
.exp-tag.bt{background:var(--bl-d);color:var(--bl);border:.5px solid var(--bl-b);}
.exp-body{border-top:.5px solid var(--bd);padding:12px;display:none;}
.exp-card.open .exp-body{display:block;}

/* ── DAILY ITEMS ── */
.daily-item{border-radius:var(--rs);border:1px solid var(--rd-b);background:var(--s1);padding:11px 13px;margin-bottom:6px;cursor:pointer;}
.daily-item.open{border-color:var(--rd);}
.daily-hd{display:flex;align-items:center;gap:8px;}
.daily-num{font-size:11px;font-weight:600;color:var(--rd);min-width:18px;font-family:'DM Mono',monospace;}
.daily-nm{font-size:13px;font-weight:500;color:var(--tx);flex:1;}
.daily-sp{font-size:11px;color:var(--t3);}
.daily-body{padding-top:8px;display:none;}
.daily-item.open .daily-body{display:block;}
.daily-why{margin-top:6px;font-size:11px;color:var(--t3);font-style:italic;line-height:1.5;padding:6px 9px;background:var(--s2);border-radius:var(--rsm);}

/* ── HISTORY ── */
.hist-entry{border-radius:var(--r);border:1px solid var(--bd);background:var(--s1);padding:13px;margin-bottom:8px;}
.hist-day{font-size:14px;font-weight:600;color:var(--tx);margin-bottom:4px;}
.hist-meta{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;}
.hist-badge{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:500;}
.hist-row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:.5px solid var(--bd);font-size:12px;}
.hist-row:last-child{border-bottom:none;}
.hist-nm{color:var(--t2);flex:1;padding-right:6px;}
.hist-val{color:var(--go);font-weight:500;font-family:'DM Mono',monospace;font-size:12px;}
.hist-empty{font-size:13px;color:var(--t3);text-align:center;padding:24px 0;}
.hist-date-hd{font-size:10px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--t3);margin:14px 0 6px;padding-bottom:5px;border-bottom:.5px solid var(--bd);}

/* ── SETTINGS ── */
.settings-group{background:var(--s1);border-radius:var(--r);border:1px solid var(--bd);overflow:hidden;margin-bottom:12px;}
.sg-label{font-size:10px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--t3);padding:10px 14px 4px;}
.sg-row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:.5px solid var(--bd);}
.sg-row:last-child{border-bottom:none;}
.sg-row-lbl{flex:1;font-size:13px;color:var(--tx);font-weight:500;}
.sg-row-sub{font-size:11px;color:var(--t3);}
.sg-in{width:100%;height:40px;background:var(--s3);border:1px solid var(--bd2);border-radius:var(--rs);color:var(--tx);font-size:13px;padding:0 11px;}
.sg-in:focus{outline:none;border-color:var(--go);}
.sg-btn{width:100%;padding:11px;border-radius:var(--rs);border:1px solid var(--bd2);background:var(--s2);font-size:13px;font-weight:500;color:var(--t2);display:flex;align-items:center;justify-content:center;gap:7px;margin-bottom:7px;}
.sg-btn.primary{background:var(--go-d);border-color:var(--go-b);color:var(--go);}
.sg-btn.danger{border-color:var(--rd-b);color:var(--rd);}
.install-card{background:var(--s1);border:1px solid var(--bl-b);border-radius:var(--r);padding:16px;margin-bottom:12px;}
.install-title{font-size:14px;font-weight:600;color:var(--bl);margin-bottom:8px;}
.install-step{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-bottom:.5px solid var(--bd);}
.install-step:last-child{border-bottom:none;}
.step-n{width:20px;height:20px;border-radius:50%;background:var(--bl-d);color:var(--bl);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
.step-t{font-size:12px;color:var(--t2);line-height:1.6;}
.step-t b{color:var(--tx);font-weight:500;}

/* ── TAB BAR ── */
.tab-bar{position:fixed;bottom:0;left:0;right:0;height:calc(var(--tab) + var(--safe-b));background:rgba(8,8,8,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--bd);display:flex;align-items:flex-start;padding-top:2px;z-index:200;}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;color:var(--t3);transition:color .15s;}
.tb svg{width:22px;height:22px;}
.tb span{font-size:9px;font-weight:500;letter-spacing:.3px;}
.tb.active{color:var(--go);}
/* ── CALENDAR ── */
.cal-wrap{padding:10px 12px 20px;}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.cal-nav-title{font-size:16px;font-weight:600;letter-spacing:-.3px;}
.cal-nav-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--bd2);background:var(--s2);display:flex;align-items:center;justify-content:center;color:var(--t2);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cal-dow{text-align:center;font-size:10px;font-weight:600;color:var(--t3);padding:4px 0 6px;letter-spacing:.4px;}
.cal-day{border-radius:var(--rs);padding:6px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;min-height:46px;border:1px solid transparent;transition:all .15s;}
.cal-day.other-month{opacity:.25;}
.cal-day.today{border-color:var(--go-b);background:var(--go-d);}
.cal-day.selected{border-color:var(--go);background:var(--go-d);}
.cal-day.has-log{border-color:var(--bd2);}
.cal-num{font-size:13px;font-weight:500;color:var(--t2);line-height:1;}
.cal-day.today .cal-num{color:var(--go);font-weight:600;}
.cal-day.selected .cal-num{color:var(--go);}
.cal-dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;min-height:6px;}
.cal-dot{width:5px;height:5px;border-radius:50%;}
.cal-detail{margin-top:12px;border-radius:var(--r);border:1px solid var(--bd2);background:var(--s1);overflow:hidden;}
.cal-detail-hd{padding:12px 14px 8px;border-bottom:1px solid var(--bd);}
.cal-detail-date{font-size:14px;font-weight:600;color:var(--tx);margin-bottom:4px;}
.cal-detail-empty{padding:16px 14px;font-size:12px;color:var(--t3);text-align:center;}
.cal-log-entry{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:.5px solid var(--bd);}
.cal-log-entry:last-child{border-bottom:none;}
.cal-log-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.cal-log-name{font-size:13px;font-weight:500;color:var(--tx);flex:1;}
.cal-log-meta{font-size:11px;color:var(--t3);}
.cal-add-btn{width:100%;padding:12px;border-top:1px solid var(--bd);background:transparent;font-size:13px;font-weight:500;color:var(--go);display:flex;align-items:center;justify-content:center;gap:7px;}
.wp-wrap{padding:10px 12px 16px;}
.wp-title{font-size:13px;font-weight:500;color:var(--tx);margin-bottom:10px;}
.wp-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px;}
.wp-btn{padding:12px 8px;border-radius:var(--r);border:1px solid var(--bd2);background:var(--s1);display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;}
.wp-btn-dot{width:10px;height:10px;border-radius:50%;}
.wp-btn-nm{font-size:12px;font-weight:500;color:var(--tx);}
.wp-back{padding:8px 0;font-size:12px;color:var(--t3);background:transparent;width:100%;}
.fb-toggle-row{display:flex;align-items:center;gap:10px;padding:14px;background:var(--s1);border-radius:var(--r);border:1px solid var(--bd2);margin-bottom:8px;}
.fb-toggle-lbl{font-size:13px;font-weight:500;color:var(--tx);flex:1;}
.fb-toggle-btn{padding:7px 18px;border-radius:var(--rs);border:1px solid var(--bd2);background:var(--s3);font-size:12px;font-weight:500;color:var(--t2);}
.fb-toggle-btn.done{background:var(--go-d);border-color:var(--go-b);color:var(--go);}

/* ══ SECURITY ══════════════════════════════════════════ */
const esc=v=>String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#x27;');
const genUID=()=>{const b=new Uint8Array(24);crypto.getRandomValues(b);return 'u'+Array.from(b,x=>x.toString(16).padStart(2,'0')).join('');};
const isVD=d=>{if(!d||typeof d!=='object'||Array.isArray(d))return false;return true;};
const dHash=o=>{const s=JSON.stringify(o);let h=0x811c9dc5;for(let i=0;i<s.length;i++)h=Math.imul(h^s.charCodeAt(i),0x01000193)>>>0;return h.toString(16);};

/* ══ INDEXEDDB ══════════════════════════════════════════ */
let idb=null;
async function openIDB(){return new Promise(r=>{const q=indexedDB.open('wt_app_v1',1);q.onupgradeneeded=e=>e.target.result.createObjectStore('kv');q.onsuccess=e=>{idb=e.target.result;r(idb);};q.onerror=()=>r(null);});}
async function idbGet(k){if(!idb)return null;return new Promise(r=>{const t=idb.transaction('kv','readonly');const q=t.objectStore('kv').get(k);q.onsuccess=()=>r(q.result??null);q.onerror=()=>r(null);});}
async function idbSet(k,v){if(!idb)return;return new Promise(r=>{const t=idb.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=r;t.onerror=r;});}

const FBU='wta_fburl',FBK='wta_fbuid',CAC='wta_cache';
let fbUrl='',userId='',syncSt='offline',lastSync='never',needsSync=false,saveTimer=null;
const fbPath=()=>fbUrl.replace(/\/$/,'')+'/wt/'+userId+'.json';

function setSyncUI(st,msg){
  syncSt=st;
  const dot=document.getElementById('sdot');
  if(dot)dot.className='sdot'+( st==='synced'?' synced':st==='saving'?' saving':st==='loading'?' loading':st==='error'?' error':'');
}
async function loadFromFB(){
  if(!fbUrl){setSyncUI('offline');return false;}
  setSyncUI('loading');
  try{
    const r=await fetch(fbPath(),{cache:'no-store'});
    if(r.status===401||r.status===403)throw new Error('Permission denied');
    if(!r.ok&&r.status!==404)throw new Error('HTTP '+r.status);
    const raw=await r.json();
    if(raw&&isVD(raw)){log=raw.log||{};prefs=raw.prefs||{};}
    cacheLocal();lastSync=new Date().toLocaleTimeString();setSyncUI('synced');return true;
  }catch(e){setSyncUI('error');return false;}
}
function schedSave(){cacheLocal();if(!fbUrl)return;clearTimeout(saveTimer);setSyncUI('saving');saveTimer=setTimeout(doSave,2500);}
async function doSave(){
  if(!fbUrl)return;setSyncUI('saving');
  try{
    const r=await fetch(fbPath(),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({log,prefs,ts:Date.now(),chk:dHash({log,prefs})})});
    if(!r.ok)throw new Error('HTTP '+r.status);
    lastSync=new Date().toLocaleTimeString();needsSync=false;setSyncUI('synced');
  }catch(e){needsSync=true;setSyncUI('error');setTimeout(()=>{if(needsSync&&navigator.onLine)doSave();},60000);}
}
window.addEventListener('online',()=>{if(needsSync&&fbUrl)doSave();});
function cacheLocal(){try{localStorage.setItem(CAC,JSON.stringify({log,prefs,ts:Date.now()}));}catch(e){}idbSet('cache',{log,prefs,ts:Date.now()});}
function loadCache(){try{const c=JSON.parse(localStorage.getItem(CAC)||'null');if(c&&c.log){log=c.log;prefs=c.prefs||{};}}catch(e){}}

function applyPrefs(){

/* ══ GET PAIRS (energy-aware) ════════════════════════ */
function getPairs(sess){
  const full=mode==='gym'?sess.gym:sess.home;
  const simple=mode==='gym'?sess.gym20:sess.home20;
  if(energy===100)return full;
  if(energy===50)return sess.idx50.map(i=>full[i]);
  return simple;
}

function getSessionType(dayId){
  const sched=SCHEDULE[fbDay];
  const day=sched.find(d=>d.id===dayId);
  if(!day)return'rest';
  if(dayId==='Daily')return'daily';
  if(day.cls==='fb-day')return'football';
  if(day.cls==='rec-day')return'active-rec';
  if(day.cls==='plyo-day')return'plyo';
  if(day.cls==='rehab-day')return'rehab';
  if(day.sub==='Full A')return'fba';
  if(day.sub==='Full B')return'fbb';
  if(day.sub==='Full C')return'fbc';
  return'rest';
}

/* ══ LOG HELPERS ════════════════════════════════════ */
function getSessionLog(dayId){return log[logKey(dayId)]||{};}
function sessionDoneCount(dayId){
  const l=getSessionLog(dayId);
  return Object.keys(l).filter(k=>!metaK(k)&&l[k]&&l[k].done).length;
}
function isLogged(dayId){return sessionDoneCount(dayId)>0;}

/* ══ TIMER ══════════════════════════════════════════ */
function startTimer(tid,rest){
  if(timers[tid]?.iv)clearInterval(timers[tid].iv);
  timers[tid]={running:true,left:rest,iv:null};
  const iv=setInterval(()=>{
    timers[tid].left--;
    const el=document.getElementById('tc-'+tid);
    const btn=document.getElementById('tb-'+tid);
    if(timers[tid].left<=0){
      clearInterval(iv);timers[tid].running=false;timers[tid].left=0;
      if(el){el.textContent='GO!';el.className='rest-ct done-rest';}
      if(btn){btn.textContent='Reset';btn.classList.remove('running');}
      try{if(navigator.vibrate)navigator.vibrate([200,100,300]);}catch(e){}
    }else{
      if(el){el.textContent=timers[tid].left+'s';el.className='rest-ct ticking';}
    }
  },1000);
  timers[tid].iv=iv;
  const btn=document.getElementById('tb-'+tid);
  if(btn){btn.textContent='Stop';btn.classList.add('running');}
}
function toggleTimer(tid,rest){
  if(timers[tid]?.running){
    clearInterval(timers[tid].iv);timers[tid].running=false;
    const btn=document.getElementById('tb-'+tid);
    if(btn){btn.textContent='Start';btn.classList.remove('running');}
  }else{
    if(timers[tid]?.left===0){timers[tid]={running:false,left:rest,iv:null};const el=document.getElementById('tc-'+tid);if(el)el.textContent=rest+'s';}
    startTimer(tid,rest);
  }
}

/* ══ LOGGING ════════════════════════════════════════ */
function logSetAction(dayId,exKey,si,rest){
  const r=document.getElementById('ri-'+exKey+'-'+si)?.value||'';
  const w=document.getElementById('wi-'+exKey+'-'+si)?.value||'';
  const lk=logKey(dayId);
  if(!log[lk])log[lk]={};
  if(!log[lk][exKey])log[lk][exKey]={sets:[]};
  log[lk][exKey].sets[si]={r,w,done:true};
  log[lk]['_m']=mode;log[lk]['_e']=energy;
  schedSave();
  const btn=document.getElementById('ck-'+exKey+'-'+si);
  if(btn)btn.classList.add('done-set');
  // Start rest timer for this pair
  const pairId=exKey.slice(0,-1); // remove 'a' or 'b'
  startTimer(dayId+'_'+pairId,rest);
  // Check if all 2 sets done → auto-mark exercise done
  const sets=log[lk][exKey].sets||[];
  if(sets.filter(s=>s?.done).length>=2){
    log[lk][exKey].done=true;
    schedSave();
    // Update progress bar
    updateProgress(dayId);
  }
}

function markPairDone(dayId,pairIdx,hasB){
  const lk=logKey(dayId);
  if(!log[lk])log[lk]={};
  const aKey='p'+pairIdx+'a',bKey='p'+pairIdx+'b';
  log[lk][aKey]=log[lk][aKey]||{};
  log[lk][aKey].done=true;
  if(hasB){log[lk][bKey]=log[lk][bKey]||{};log[lk][bKey].done=true;}
  log[lk]['_m']=mode;log[lk]['_e']=energy;
  schedSave();
  openCard=null;
  buildStrip();
  renderSession();
}

function unmarkPairDone(dayId,pairIdx,hasB){
  const lk=logKey(dayId);
  const aKey='p'+pairIdx+'a',bKey='p'+pairIdx+'b';
  if(log[lk]){
    delete log[lk][aKey];
    if(hasB)delete log[lk][bKey];
    if(Object.keys(log[lk]).filter(k=>!metaK(k)).length===0)delete log[lk];
  }
  schedSave();
  buildStrip();
  renderSession();
}

function updateProgress(dayId){
  const pairs=getCurrentPairs(dayId);
  const l=getSessionLog(dayId);
  let done=0,total=0;
  pairs.forEach((_,pi)=>{
    total+=2;
    if(l['p'+pi+'a']?.done)done++;
    if(l['p'+pi+'b']?.done)done++;
  });
  const fill=document.getElementById('prog-fill');
  const lbl=document.getElementById('prog-lbl');
  if(fill)fill.style.width=(total?Math.round(done/total*100):0)+'%';
  if(lbl)lbl.textContent=done+'/'+total;
}

function getCurrentPairs(dayId){
  const type=getSessionType(dayId);
  if(type==='fba')return getPairs(FBA);
  if(type==='fbb')return getPairs(FBB);
  if(type==='fbc')return getPairs(FBC);
  return[];
}

  h+=`<div class="set-col-labels"><span></span><span>Reps</span><span>kg</span><span></span></div>`;
  h+=`<div class="set-rows">`;
  for(let s=0;s<2;s++){
    const prev=prevSets[s]||{};

      <span class="set-lbl">${s+1}</span>
      <input class="set-in" type="number" id="ri-${exKey}-${s}" placeholder="reps" value="${esc(prev.r||'')}" inputmode="numeric" min="0">

  keys.forEach(k=>{
    if(!k.includes('__'))return;

    const dl=log[k];

    const accentColors={fba:'#7f77dd',fbb:'#639922',fbc:'#9b7edb',plyo:'#f5b84e',rehab:'#4eaff5','active-rec':'#b07ef5',football:'#6db33f'};
    const ac=accentColors[type]||'#4a4845';
    html+=`<div class="hist-entry" style="border-left:3px solid ${ac};">
      <div class="hist-day">${sessionName}</div>
      <div class="hist-meta">
        <span class="hist-badge" style="background:${lm==='gym'?'var(--bl-d)':'var(--pu-d)'};color:${lm==='gym'?'var(--bl)':'var(--pu)'};">${lm==='gym'?'Gym':'Home'}</span>

    Object.keys(dl).filter(k=>!metaK(k)).forEach(exKey=>{
      const xl=dl[exKey];if(!xl)return;
      if(xl.sets){xl.sets.forEach((ss,si)=>{
        if(!ss?.done)return;hasRows=true;
        html+=`<div class="hist-row"><span class="hist-nm">${esc(exKey)} · set ${si+1}</span><span class="hist-val">${esc(ss.r||'—')} reps${ss.w?' @ '+esc(ss.w)+'kg':''}</span></div>`;
      });}else if(xl.done){hasRows=true;html+=`<div class="hist-row"><span class="hist-nm">${esc(exKey)}</span><span class="hist-val">✓</span></div>`;}

    html+=`</div>`;
  });
  html+=`</div>`;
  return html;
}

let lastDiag=null;

async function testFirebaseConnection(){
  const v=(document.getElementById('fb-url-in')?.value||fbUrl||'').trim();
  if(!v){
    lastDiag={ok:false,msg:'No URL entered. Paste your Firebase URL above first.'};
    renderSession();return;
  }
  const url=v.replace(/\/$/,'')+'/wt/'+userId+'.json';
  lastDiag={ok:false,msg:'Testing '+url+' …'};
  renderSession();
  try{
    const r=await fetch(url,{cache:'no-store'});
    const body=await r.text();
    const preview=body.length>120?body.slice(0,120)+'…':body;
    if(r.ok){
      lastDiag={ok:true,msg:'HTTP '+r.status+' OK ✓\nResponse: '+preview+'\n\nFirebase is connected and rules are correct.'};
    }else if(r.status===401||r.status===403){
      lastDiag={ok:false,msg:'HTTP '+r.status+' Permission Denied ✗\n\nYour Firebase RULES are blocking access.\n\nFix: In Firebase console → Realtime Database → Rules tab, paste exactly:\n{"rules":{"wt":{"$uid":{".read":true,".write":true}}}}\nthen click Publish.'};
    }else if(r.status===404){
      lastDiag={ok:false,msg:'HTTP 404 Not Found ✗\n\nThe URL path doesn\'t exist. Check the database URL is correct and the database has been created (not just the project).'};
    }else{
      lastDiag={ok:false,msg:'HTTP '+r.status+' ✗\nResponse: '+preview};
    }
  }catch(err){
    if(err.message.includes('fetch')||err.message.includes('network')||err.message.includes('Failed')){
      lastDiag={ok:false,msg:'Network error: could not reach Firebase.\n\n• Check the URL spelling — it must be exactly:\n  https://YOUR-PROJECT-default-rtdb.firebaseio.com\n• Make sure your phone has internet\n• The "default-rtdb" part might have a region suffix in some countries, e.g. .europe-west1.firebaseio.com'};
    }else{
      lastDiag={ok:false,msg:'Error: '+err.message};
    }
  }
  renderSession();
}

function saveFirebaseUrl(){
  const v=(document.getElementById('fb-url-in')?.value||'').trim();
  if(!v){
    fbUrl='';localStorage.removeItem(FBU);idbSet('fbUrl','');
    lastDiag=null;setSyncUI('offline');renderSession();return;
  }
  if(!v.startsWith('https://')||!v.includes('firebaseio.com')){
    lastDiag={ok:false,msg:'Invalid URL format.\nMust start with https:// and contain firebaseio.com\n\nExample: https://my-project-default-rtdb.firebaseio.com'};
    renderSession();return;
  }
  fbUrl=v.replace(/\/$/,'');
  localStorage.setItem(FBU,fbUrl);idbSet('fbUrl',fbUrl);
  lastDiag=null;setSyncUI('saving');
  doSave().then(()=>renderSession());
}

async function manualSync(){
  if(!fbUrl){lastDiag={ok:false,msg:'No Firebase URL saved. Enter and save your URL first.'};renderSession();return;}
  await doSave();

}
function exportData(){
  const d={log,prefs,userId,exported:new Date().toISOString(),version:1};
  const blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='workout_backup_'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}
function importData(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);
      if(!d.log&&!d.prefs)throw new Error('Not valid workout data');
      if(d.log)log=d.log;if(d.prefs)prefs=d.prefs;
      schedSave();applyPrefs();buildStrip();renderSession();
      alert('Import successful.');
    }catch(err){alert('Import failed: '+err.message);}
  };
  reader.readAsText(file);input.value='';
}

  if(type==='daily')return renderDaily();
  if(type==='football')return renderFootball();
  if(type==='active-rec')return renderActiveRec();
  if(type==='plyo')return renderPlyo(dayId);
  if(type==='rehab')return renderRehab();
  if(type==='fba')return renderFB(FBA,dayId);
  if(type==='fbb')return renderFB(FBB,dayId);
  if(type==='fbc')return renderFB(FBC,dayId);
  return renderRest();
}

function renderSession(){
  if(curTab==='today'){
    document.getElementById('app').innerHTML=getSessionHTML(view);
  }else if(curTab==='calendar'){
    document.getElementById('app').innerHTML=renderCalendar();
  }else if(curTab==='history'){
    document.getElementById('app').innerHTML=renderHistory();
  }else if(curTab==='settings'){
    document.getElementById('app').innerHTML=renderSettings();
  }
  Object.entries(timers).forEach(([tid,t])=>{
    const el=document.getElementById('tc-'+tid);
    if(el&&t.running){el.textContent=t.left+'s';el.className='rest-ct ticking';}
  });
  attachListeners();
}

/* ══ CALENDAR ════════════════════════════════════════════ */
const WORKOUT_TYPES={
  'fba':{name:'Full Body A',color:'#7f77dd'},
  'fbb':{name:'Full Body B',color:'#639922'},
  'fbc':{name:'Full Body C',color:'#9b7edb'},
  'plyo':{name:'Plyo + Rehab',color:'#f5b84e'},
  'rehab':{name:'Rehab + Run',color:'#4eaff5'},
  'active-rec':{name:'Active Recovery',color:'#b07ef5'},
  'football':{name:'Football ⚽',color:'#6db33f'},
  'daily':{name:'Daily Correctives',color:'#f5604e'},
  // Legacy schedule day IDs
  'Mon':{name:'Football',color:'#6db33f'},
  'Tue':{name:'Active Recovery',color:'#b07ef5'},
  'Wed':{name:'Full Body A',color:'#7f77dd'},
  'Thu':{name:'Full Body B',color:'#639922'},
  'Fri':{name:'Plyo + Rehab',color:'#f5b84e'},
  'Sat':{name:'Full Body C',color:'#9b7edb'},
  'Sun':{name:'Rest',color:'#5a5855'},
};

function getLoggedDates(){
  const result={};
  Object.keys(log).forEach(function(key){
    const parts=key.split('__');
    if(parts.length<2)return;
    const dt=parts[0];
    if(!/^\d{4}-\d{2}-\d{2}$/.test(dt))return;
    const typeId=parts.slice(1).join('__');
    if(typeId==='Sun')return; // don't show rest days as logged
    if(!result[dt])result[dt]=[];
    result[dt].push(typeId);
  });
  return result;
}

function isoToDate(iso){const[y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d);}
function dateToISO(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function todayISO(){return dateToISO(new Date());}

function renderCalendar(){
  const now=new Date();
  if(!calMonth)calMonth={y:now.getFullYear(),m:now.getMonth()};
  const {y,m}=calMonth;
  const loggedDates=getLoggedDates();
  const todayStr=todayISO();
  const DOW_LABELS=['M','T','W','T','F','S','S'];

  // First day of month and total days
  const firstDay=new Date(y,m,1);
  const lastDay=new Date(y,m+1,0);
  const startDow=(firstDay.getDay()+6)%7; // Mon=0, Sun=6
  const totalDays=lastDay.getDate();

  const monthName=firstDay.toLocaleString('en',{month:'long',year:'numeric'});

  let h=`<div class="cal-wrap">
    <div class="cal-nav">
      <button class="cal-nav-btn" data-calmonth="-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="18" height="18"><path d="M15 18l-6-6 6-6"/></svg></button>
      <span class="cal-nav-title">${monthName}</span>
      <button class="cal-nav-btn" data-calmonth="1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="18" height="18"><path d="M9 18l6-6-6-6"/></svg></button>
    </div>
    <div class="cal-grid">`;

  // Day headers
  DOW_LABELS.forEach(function(d){h+=`<div class="cal-dow">${d}</div>`;});

  // Leading empty cells
  for(let i=0;i<startDow;i++){h+=`<div class="cal-day other-month"></div>`;}

  // Day cells
  for(let d=1;d<=totalDays;d++){
    const iso=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const isToday=iso===todayStr;
    const isSel=iso===calSelectedDate;
    const logs=loggedDates[iso]||[];
    const hasLog=logs.length>0;
    const cls='cal-day'+(isToday?' today':'')+(isSel?' selected':'')+(hasLog?' has-log':'');
    const dots=logs.slice(0,3).map(function(t){const wt=WORKOUT_TYPES[t];return `<div class="cal-dot" style="background:${wt?wt.color:'#888'}"></div>`;}).join('');
    h+=`<div class="${cls}" data-calday="${iso}">
      <span class="cal-num">${d}</span>
      <div class="cal-dots">${dots}</div>
    </div>`;
  }
  h+=`</div>`; // end cal-grid

  // Selected day detail
  if(calSelectedDate){
    h+=renderCalDayDetail(calSelectedDate,loggedDates[calSelectedDate]||[]);
  }

  h+=`</div>`;
  return h;
}

function renderCalDayDetail(iso,typeIds){
  const d=isoToDate(iso);
  const dateStr=d.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'short',year:'numeric'});
  const todayStr=todayISO();
  const isFuture=iso>todayStr;

  // If in picker mode for this date, show workout session
  if(calPickerDate===iso){
    return renderCalWorkoutPicker(iso);
  }
  // If a workout type is being logged for this date (stored in calLogDate context)
  if(calLogDate===iso && calPickerDate===null){
    // Show the logging session
    const typeId=log['_caltype_'+iso];
    if(typeId)return renderCalSessionForDate(iso,typeId);
  }

  let h=`<div class="cal-detail">
    <div class="cal-detail-hd">
      <div class="cal-detail-date">${dateStr}</div>
    </div>`;

  if(typeIds.length===0){
    h+=`<div class="cal-detail-empty">No workout logged for this day.</div>`;
  }else{
    typeIds.forEach(function(typeId){
      const wt=WORKOUT_TYPES[typeId]||{name:typeId,color:'#888'};
      const dl=log[iso+'__'+typeId]||{};
      const done=Object.keys(dl).filter(k=>!metaK(k)&&dl[k]?.done).length;
      h+=`<div class="cal-log-entry">
        <div class="cal-log-dot" style="background:${wt.color}"></div>
        <span class="cal-log-name">${wt.name}</span>
        <span class="cal-log-meta">${done>0?done+' sets logged':'completed'}</span>
      </div>`;
    });
  }

  if(!isFuture){
    h+=`<button class="cal-add-btn" data-caladd="${iso}">+ Log a workout for this day</button>`;
  }

  h+=`</div>`;
  return h;
}

function renderCalWorkoutPicker(iso){
  const d=isoToDate(iso);
  const dateStr=d.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});
  const types=[
    ['fba','Full Body A'],['fbb','Full Body B'],['fbc','Full Body C'],
    ['plyo','Plyo + Rehab'],['rehab','Rehab + Run'],['active-rec','Active Recovery'],
    ['football','Football ⚽'],['daily','Daily Correctives'],
  ];
  let h=`<div class="cal-detail">
    <div class="cal-detail-hd">
      <div class="cal-detail-date">Log workout · ${dateStr}</div>
    </div>
    <div class="wp-wrap">
      <div class="wp-grid">`;
  types.forEach(function([id,name]){
    const wt=WORKOUT_TYPES[id]||{color:'#888'};
    h+=`<button class="wp-btn" data-calpick="${id}" data-caldate="${iso}">
      <div class="wp-btn-dot" style="background:${wt.color}"></div>
      <span class="wp-btn-nm">${name}</span>
    </button>`;
  });
  h+=`</div>
      <button class="wp-back" data-calcancel="${iso}">← Cancel</button>
    </div>
  </div>`;
  return h;
}

function renderCalSessionForDate(iso,typeId){
  const wt=WORKOUT_TYPES[typeId]||{name:typeId,color:'#888'};
  const d=isoToDate(iso);
  const dateStr=d.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});

  let h=`<div class="cal-detail">
    <div class="cal-detail-hd">
      <div class="cal-detail-date">${wt.name} · ${dateStr}</div>
    </div>`;

  if(typeId==='football'){
    const lk=iso+'__football';
    const isDone=!!(log[lk]&&log[lk]._done);
    h+=`<div class="fb-toggle-row">
      <span class="fb-toggle-lbl">Football played on this day</span>
      <button class="fb-toggle-btn${isDone?' done':''}" data-calfbtoggle="${iso}">${isDone?'✓ Played':'Mark played'}</button>
    </div>`;
  }else if(typeId==='daily'||typeId==='active-rec'||typeId==='rehab'||typeId==='plyo'){
    const lk=iso+'__'+typeId;
    const isDone=!!(log[lk]&&log[lk]._done);
    h+=`<div class="fb-toggle-row">
      <span class="fb-toggle-lbl">${wt.name}</span>
      <button class="fb-toggle-btn${isDone?' done':''}" data-caldone="${iso}" data-caltype="${typeId}">${isDone?'✓ Done':'Mark done'}</button>
    </div>`;
  }else{
    // Full Body session — render full workout with logging
    const sessMap={'fba':FBA,'fbb':FBB,'fbc':FBC};
    const sess=sessMap[typeId];
    if(sess){
      calLogDate=iso;
      const pairs=mode==='gym'?sess.gym:sess.home;
      h+=`<div style="padding:10px 12px 4px;">
        <div class="note inf" style="margin-bottom:8px;">${sess.note}</div>`;
      pairs.forEach(function(pair,pi){h+=pairCardHTML(pair,pi,typeId);});
      h+=`</div>`;
    }
  }

  h+=`<button class="wp-back" style="border-top:1px solid var(--bd);padding:12px;" data-calcancel="${iso}">← Back</button>`;
  h+=`</div>`;
  return h;
}

function calSelectDay(iso){
  calSelectedDate=(calSelectedDate===iso)?null:iso;
  calPickerDate=null;
  renderSession();
}
function calNavMonth(dir){
  if(!calMonth){const n=new Date();calMonth={y:n.getFullYear(),m:n.getMonth()};}
  calMonth.m+=dir;
  if(calMonth.m>11){calMonth.m=0;calMonth.y++;}
  if(calMonth.m<0){calMonth.m=11;calMonth.y--;}
  renderSession();
}
function calStartPicker(iso){
  calPickerDate=iso;
  calSelectedDate=iso;
  renderSession();
}
function calCancelPicker(iso){
  calPickerDate=null;
  calLogDate=null;
  calSelectedDate=iso;
  delete log['_caltype_'+iso];
  renderSession();
}
function calPickWorkout(iso,typeId){
  calPickerDate=null;
  calLogDate=iso;
  log['_caltype_'+iso]=typeId;
  renderSession();
}
function calToggleFootball(iso){
  const lk=iso+'__football';
  if(!log[lk])log[lk]={};
  log[lk]._done=!log[lk]._done;
  schedSave();renderSession();
}
function calMarkDone(iso,typeId){
  const lk=iso+'__'+typeId;
  if(!log[lk])log[lk]={};
  log[lk]._done=!log[lk]._done;
  schedSave();renderSession();
}

function attachListeners(){
  // Calendar day cells
  document.querySelectorAll('[data-calday]').forEach(function(el){
    el.addEventListener('click',function(e){e.stopPropagation();calSelectDay(el.dataset.calday);});
  });
  // Calendar month nav
  document.querySelectorAll('[data-calmonth]').forEach(function(el){
    el.addEventListener('click',function(e){e.stopPropagation();calNavMonth(parseInt(el.dataset.calmonth));});
  });
  // Calendar add workout button
  document.querySelectorAll('[data-caladd]').forEach(function(el){
    el.addEventListener('click',function(e){e.stopPropagation();calStartPicker(el.dataset.caladd);});
  });
  // Calendar workout type picker
  document.querySelectorAll('[data-calpick]').forEach(function(el){
    el.addEventListener('click',function(e){e.stopPropagation();calPickWorkout(el.dataset.caldate,el.dataset.calpick);});
  });
  // Calendar cancel
  document.querySelectorAll('[data-calcancel]').forEach(function(el){
    el.addEventListener('click',function(e){e.stopPropagation();calCancelPicker(el.dataset.calcancel);});
  });
  // Football toggle for calendar
  document.querySelectorAll('[data-calfbtoggle]').forEach(function(el){
    el.addEventListener('click',function(e){e.stopPropagation();calToggleFootball(el.dataset.calfbtoggle);});
  });
  // Generic done toggle for calendar
  document.querySelectorAll('[data-caldone]').forEach(function(el){
    el.addEventListener('click',function(e){e.stopPropagation();calMarkDone(el.dataset.caldone,el.dataset.caltype);});
  });
  // Pair card headers — open/close
  document.querySelectorAll('.pair-hd[data-pair]').forEach(function(hd){
    hd.addEventListener('click',function(e){
      e.stopPropagation();
      const pi=parseInt(hd.dataset.pair);
      const card=document.getElementById('pair-'+pi);
      if(!card)return;
      const wasOpen=card.classList.contains('pair-open');
      document.querySelectorAll('.pair-card.pair-open').forEach(function(c){c.classList.remove('pair-open');});
      if(!wasOpen){
        card.classList.add('pair-open');
        setTimeout(function(){card.scrollIntoView({behavior:'smooth',block:'start'});},80);
      }
    });
  });

  // Set checkmark buttons
  document.querySelectorAll('.set-ck[data-exkey]').forEach(function(btn){
    btn.addEventListener('click',function(e){
      e.stopPropagation();
      logSetAction(btn.dataset.day,btn.dataset.exkey,parseInt(btn.dataset.si),parseInt(btn.dataset.rest)||60);
    });
  });

  // Mark pair done / undo
  document.querySelectorAll('.mark-btn[data-markpair]').forEach(function(btn){
    btn.addEventListener('click',function(e){
      e.stopPropagation();
      const pi=parseInt(btn.dataset.markpair);
      const hasB=btn.dataset.hasb==='true';
      const day=btn.dataset.day;
      if(btn.classList.contains('done-mark'))unmarkPairDone(day,pi,hasB);
      else markPairDone(day,pi,hasB);
    });
  });

  // Rest timer buttons
  document.querySelectorAll('.rest-btn[data-tid]').forEach(function(btn){
    btn.addEventListener('click',function(e){
      e.stopPropagation();
      toggleTimer(btn.dataset.tid,parseInt(btn.dataset.rest)||60);
    });
  });

  // Expand cards (rehab/plyo)
  document.querySelectorAll('.exp-hd[data-eid]').forEach(function(hd){
    hd.addEventListener('click',function(e){
      e.stopPropagation();
      const id=hd.dataset.eid;
      const card=document.getElementById('exp-'+id);
      if(!card)return;
      const wasOpen=card.classList.contains('open');
      document.querySelectorAll('.exp-card.open').forEach(function(c){c.classList.remove('open');});
      if(!wasOpen)card.classList.add('open');
    });
  });

  // Daily corrective items
  document.querySelectorAll('.daily-hd[data-did]').forEach(function(hd){
    hd.addEventListener('click',function(e){
      e.stopPropagation();
      const id=hd.dataset.did;
      const item=document.getElementById('di-'+id);
      if(!item)return;
      const wasOpen=item.classList.contains('open');
      document.querySelectorAll('.daily-item.open').forEach(function(i){i.classList.remove('open');});
      if(!wasOpen)item.classList.add('open');
    });
  });

  // Energy buttons
  document.querySelectorAll('.ebtn[data-energy]').forEach(function(btn){
    btn.addEventListener('click',function(e){
      e.stopPropagation();
      setEnergy(parseInt(btn.dataset.energy));
    });
  });

  // Settings action buttons
  document.querySelectorAll('[data-action]').forEach(function(btn){
    btn.addEventListener('click',function(e){
      e.stopPropagation();
      const a=btn.dataset.action;
      if(a==='save-fb')saveFirebaseUrl();
      else if(a==='test-fb')testFirebaseConnection();
      else if(a==='sync-now')manualSync().then(function(){renderSession();});
      else if(a==='export-data')exportData();
      else if(a==='import-data')document.getElementById('imp-f')?.click();
      else if(a==='copy-uid')copyUID();
      else if(a==='clear-all')clearAll();
    });
  });
}

function switchTab(tab){
  curTab=tab;
  ['today','calendar','history','settings'].forEach(t=>{
    const el=document.getElementById('tb-'+t);
    if(el)el.classList.toggle('active',t===tab);
  });
  const showNav=tab==='today';
  document.querySelector('.ftgl').style.display=showNav?'flex':'none';
  document.querySelector('.day-strip').style.display=showNav?'block':'none';
  const er=document.querySelector('.energy-row');
  if(er)er.style.display=showNav?'flex':'none';
  // Reset calendar log context when leaving calendar
  if(tab!=='calendar'){calLogDate=null;calPickerDate=null;}
  renderSession();
}

function setMode(m){
  mode=m;prefs.mode=m;schedSave();
  document.getElementById('mbtn-gym').classList.toggle('on-gym',m==='gym');
  document.getElementById('mbtn-home').classList.toggle('on-home',m==='home');
  renderSession();
}

function setFbDay(d){
  fbDay=d;prefs.fbDay=d;schedSave();
  const fm=document.getElementById('ftgl-mon'),ff=document.getElementById('ftgl-fri');
  if(fm)fm.classList.toggle('on',d==='mon');
  if(ff)ff.classList.toggle('on',d==='fri');
  buildStrip();renderSession();
}

function setView(v){
  view=v;openCard=null;
  Object.values(timers).forEach(t=>{if(t.iv)clearInterval(t.iv);});
  timers={};
  buildStrip();renderSession();
  window.scrollTo(0,0);
}

function setEnergy(e){
  energy=e;prefs.energy=e;schedSave();
  renderSession();
}

function buildStrip(){
  const sched=SCHEDULE[fbDay];
  const inner=document.getElementById('day-inner');
  inner.innerHTML='';
  sched.forEach(function(d){
    const btn=document.createElement('button');
    btn.type='button';
    const logged=d.id!=='Daily'&&isLogged(d.id);
    btn.className='dc'+(d.cls?' '+d.cls:'')+(view===d.id?' active':'')+(logged?' logged-day':'');
    btn.innerHTML='<span class="dn">'+d.lbl+'</span><span class="ds">'+d.sub+'</span>';
    const dayId=d.id;
    btn.addEventListener('click',function(){setView(dayId);});
    inner.appendChild(btn);
  });
}

document.addEventListener('click',function(e){
  // Settings action buttons (rendered dynamically inside #app)
  const actbtn=e.target.closest('[data-action]');
  if(actbtn){
    const a=actbtn.dataset.action;
    if(a==='save-fb'){saveFirebaseUrl();return;}
    if(a==='test-fb'){testFirebaseConnection();return;}
    if(a==='sync-now'){manualSync().then(()=>renderSession());return;}
    if(a==='export-data'){exportData();return;}
    if(a==='import-data'){document.getElementById('imp-f')?.click();return;}

    if(a==='clear-all'){clearAll();return;}

    if(!card)return;

    if(!wasOpen){
      card.classList.add('pair-open');
      setTimeout(()=>card.scrollIntoView({behavior:'smooth',block:'start'}),60);
    }
    return;
  }

  // Set checkmark buttons
  const ck=e.target.closest('[data-exkey][data-si][data-day]');
  if(ck&&ck.dataset.exkey){
    e.stopPropagation();
    logSetAction(ck.dataset.day,ck.dataset.exkey,parseInt(ck.dataset.si),parseInt(ck.dataset.rest)||60);
    return;
  }

  // Mark pair done / undo
  const mp=e.target.closest('[data-markpair]');
  if(mp){
    const pi=parseInt(mp.dataset.markpair);
    const hasB=mp.dataset.hasb==='true';
    const day=mp.dataset.day;
    const pDone=mp.classList.contains('done-mark');
    if(pDone)unmarkPairDone(day,pi,hasB);
    else markPairDone(day,pi,hasB);
    return;
  }

  // Rest timer button
  const rtb=e.target.closest('[data-tid][data-rest]');
  if(rtb){
    toggleTimer(rtb.dataset.tid,parseInt(rtb.dataset.rest)||60);
    return;
  }

  // Expand cards (rehab/plyo simple cards)
  const eid=e.target.closest('[data-eid]');
  if(eid){
    const id=eid.dataset.eid;
    const card=document.getElementById('exp-'+id);
    if(!card)return;
    const wasOpen=card.classList.contains('open');
    document.querySelectorAll('.exp-card.open').forEach(c=>c.classList.remove('open'));
    if(!wasOpen)card.classList.add('open');
    return;
  }

  // Daily items
  const did=e.target.closest('[data-did]');
  if(did){
    const id=did.dataset.did;
    const item=document.getElementById('di-'+id);
    if(!item)return;
    const wasOpen=item.classList.contains('open');
    document.querySelectorAll('.daily-item.open').forEach(i=>i.classList.remove('open'));
    if(!wasOpen)item.classList.add('open');
    return;
  }
});

/* ══ INIT ══════════════════════════════════════════ */
async function init(){
  await openIDB();

  // Load userId
  const idbUid=await idbGet('userId'),lsUid=localStorage.getItem(FBK);
  if(idbUid)userId=idbUid;
  else if(lsUid){userId=lsUid;await idbSet('userId',userId);}
  else{userId=genUID();localStorage.setItem(FBK,userId);await idbSet('userId',userId);}

  // Load Firebase URL
  const idbUrl=await idbGet('fbUrl'),lsUrl=localStorage.getItem(FBU);
  if(idbUrl)fbUrl=idbUrl;
  else if(lsUrl){fbUrl=lsUrl;await idbSet('fbUrl',fbUrl);}

  // Load local cache
  loadCache();
  applyPrefs();

  // Set today as default view
  const today=todayName();
  const sched=SCHEDULE[fbDay];
  view=sched.find(d=>d.id===today)?today:'Mon';

  buildStrip();
  renderSession();
  setSyncUI('offline');
  // Set Today tab active
  document.getElementById('tb-today').classList.add('active');

  // Wire import file input — must use addEventListener, not inline onchange
  document.addEventListener('change',function(e){
    if(e.target.id==='imp-f')importData(e.target);
  });

  // Load from Firebase in background
  if(fbUrl){
    const ok=await loadFromFB();
    if(ok){applyPrefs();buildStrip();renderSession();}
  }
}

    };

    if(el)el.href=URL.createObjectURL(blob);
  }catch(e){}
})();

init();
</script>
